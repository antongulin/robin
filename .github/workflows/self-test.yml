name: "Self-Test"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      usage-report: ${{ steps.usage-output.outputs.usage-report }}
    env:
      HAS_LLM: ${{ secrets.LLM_API_KEY != '' && secrets.LLM_BASE_URL != '' && secrets.LLM_MODEL != '' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Install actionlint
        # Pin version + SHA256 of the linux_amd64 release tarball (no curl|bash).
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Lint workflows
        # Catches undeclared workflow_call inputs the same way GitHub does for
        # consumers (e.g. request-changes missing from review.yml). Also lints
        # testdata/consumer-workflows fixtures that pass every reusable input.
        run: ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml testdata/consumer-workflows/*.yml
       
      - name: Test
        run: npm test
       
      - name: Build
        run: npm run build

      - name: Verify committed bundle
        run: git diff --exit-code dist/index.js

      - name: Publish usage with masked model labels
        id: usage-output
        run: |
          node <<'NODE'
          require('ts-node/register');
          const core = require('@actions/core');
          const { UsageLedger, publishUsageReport } = require('./src/usage-report');
          const requested = 'synthetic-masked-requested-model';
          const reported = 'synthetic-masked-provider-model';
          core.setSecret(requested);
          core.setSecret(reported);
          const ledger = new UsageLedger();
          ledger.configure({ requested_model: requested });
          const attempt = ledger.begin({ phase: 'single-shot-initial' }, ledger.startCall(), 1, 1, 'initial',
            { model: requested, stream: false, effortRemoved: false });
          ledger.capture(attempt, { model: reported,
            usage: { prompt_tokens: 11, completion_tokens: 7, total_tokens: 18 } });
          ledger.received(attempt);
          ledger.finish(attempt, 'accepted');
          ledger.state = 'completed';
          publishUsageReport(ledger).catch(error => { throw error; });
          NODE
      
      - name: Use the action on itself
        if: github.event_name == 'pull_request' && env.HAS_LLM == 'true'
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          max-diff-size: "100000"
          fail-on-high: "false"
          # This repository dogfoods Robin on every push; consumers opt in the same way.
          review-on-synchronize: "true"

  usage-output-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify usage crossed the job boundary
        env:
          USAGE_REPORT: ${{ needs.test.outputs.usage-report }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.ok(process.env.USAGE_REPORT, 'Masked-model usage output must reach the dependent job');
          const report = JSON.parse(process.env.USAGE_REPORT);
          assert.equal(report.schema_version, 1);
          assert.equal(report.state, 'completed');
          assert.equal(report.attempts, 1);
          assert.equal(report.logical_calls, 1);
          assert.equal(report.requested_model, null);
          assert.deepEqual(report.model_groups, []);
          assert.equal(report.model_groups_omitted, 1);
          for (const [metric, count] of Object.entries({ prompt_tokens: 11, completion_tokens: 7, total_tokens: 18 })) {
            assert.deepEqual(report.metrics[metric], { observed_sum: count, observed_attempts: 1,
              final_attempts: 1, unknown_attempts: 0, nonfinal_attempts: 0, complete: true, overflow: false });
          }
          assert.equal(report.phases['single-shot-initial'].attempts, 1);
          assert.equal(report.outcomes.accepted, 1);
          assert.equal(report.triggers.initial, 1);
          NODE

  command-test:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/robin') ||
        startsWith(github.event.comment.body, '/summary') ||
        startsWith(github.event.comment.body, '/help')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_LLM: ${{ secrets.LLM_API_KEY != '' && secrets.LLM_BASE_URL != '' && secrets.LLM_MODEL != '' }}
    steps:
      - uses: actions/checkout@v4
       
      - name: Run Robin command
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
