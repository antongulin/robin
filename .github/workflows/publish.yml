name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret needed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const pkg = require('./package.json');
          const tag = process.env.RELEASE_TAG;
          if (!process.env.GITHUB_REF.startsWith('refs/tags/') ||
              !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) ||
              pkg.name !== 'robin-review' || pkg.version !== tag.slice(1)) {
            throw new Error('Publish requires an exact release tag matching robin-review package.json.');
          }
          console.log(`Verified ${pkg.name}@${pkg.version} at ${tag}`);
          JS

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; runner images may ship older.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Publish if version is new
        run: |
          set -euo pipefail
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm — nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
