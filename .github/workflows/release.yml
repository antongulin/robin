name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-pr:
        description: "Release PR number to resume (open or merged; run on main)"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && !inputs.release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Publication belongs to the verified release path below, including
          # human-merged releases and dispatch recovery after branch deletion.
          skip-github-release: true

  auto-release:
    needs: release-please
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.select.outputs.number }}
      sha: ${{ steps.select.outputs.sha }}
      state: ${{ steps.select.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select trusted release PR
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ inputs.release-pr }}
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
          RELEASE_PRS: ${{ needs.release-please.outputs.prs }}
          RELEASE_PRS_CREATED: ${{ needs.release-please.outputs.prs_created }}
        run: node scripts/release-control.cjs select

  verify-release:
    needs: auto-release
    if: >-
      !cancelled() && needs.auto-release.result == 'success' &&
      (needs.auto-release.outputs.state == 'OPEN' || needs.auto-release.outputs.state == 'MERGED')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check out immutable release tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ needs.auto-release.outputs.number }}
          SELECTED_SHA: ${{ needs.auto-release.outputs.sha }}
          SELECTED_STATE: ${{ needs.auto-release.outputs.state }}
        run: |
          set -euo pipefail
          # Old merged trees may not contain this helper. Preserve trusted control
          # code before checkout; never execute a helper supplied by a PR.
          cp scripts/release-control.cjs "$RUNNER_TEMP/release-control.cjs"
          node "$RUNNER_TEMP/release-control.cjs" checkout
      - name: Verify release tree
        # No write token or persisted Git credentials in this job. Package scripts
        # execute only after fresh bot/repo/branch/label/SHA validation.
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test -- --runInBand
          npm run build
          git diff --exit-code dist/index.js

  publish-release:
    needs: [auto-release, verify-release]
    if: >-
      !cancelled() && needs.auto-release.result == 'success' &&
      needs.verify-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Merge verified head and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ needs.auto-release.outputs.number }}
          SELECTED_SHA: ${{ needs.auto-release.outputs.sha }}
          SELECTED_STATE: ${{ needs.auto-release.outputs.state }}
        # This job executes trusted control code only, never release-tree scripts.
        run: node scripts/release-control.cjs publish
