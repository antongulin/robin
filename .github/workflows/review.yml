name: Robin

on:
  workflow_call:
    inputs:
      fail-on-high:
        description: "Fail the workflow when high severity issues are found."
        required: false
        type: boolean
        default: false
      request-changes:
        description: "Whether a high severity finding submits a blocking REQUEST_CHANGES review. true posts REQUEST_CHANGES; false always posts COMMENT (advisor mode). Omit to use the repo config, which defaults to true."
        required: false
        type: boolean
        # No default: omitted must stay unset so .github/robin.yml can still win.
        # A boolean default of true would override repo-config advisor mode.
      max-diff-size:
        description: "Maximum diff characters sent to the model."
        required: false
        type: string
        default: "50000"
      max-comments:
        description: "Maximum inline review comments. Extra findings stay in the review body."
        required: false
        type: string
        default: "15"
      max-output-tokens:
        description: "Optional maximum tokens for the LLM response. Leave empty to use the provider/model default."
        required: false
        type: string
        default: ""
      reasoning-effort:
        description: "Reasoning effort for providers/models that accept it; empty defers to .github/robin.yml. When both are unset no reasoning control is sent. off sends no reasoning configuration explicitly. Rejected controls or values retry once without the override."
        required: false
        type: string
        default: ""
      llm-timeout-ms:
        description: "LLM request timeout in milliseconds."
        required: false
        type: string
        default: "600000"
      llm-temperature:
        description: "Sampling temperature for LLM requests, between 0 and 2. Some models only accept a fixed value (for example Kimi requires 1)."
        required: false
        type: string
        default: "0.1"
      min-command-permission:
        description: "Minimum repository permission required to run slash commands."
        required: false
        type: string
        default: "write"
      review-instructions-file:
        description: "Repository file containing additional reviewer instructions."
        required: false
        type: string
        default: ".github/code-reviewer.md"
      review-instructions:
        description: "Additional reviewer instructions appended to the built-in prompt."
        required: false
        type: string
        default: ""
      review-on-synchronize:
        description: "Review pushes to an existing PR (pull_request synchronize event). Default false; set true and trigger on synchronize to review every push."
        required: false
        type: boolean
        default: false
      config-file:
        description: "Optional repository config file on the PR base branch."
        required: false
        type: string
        default: ".github/robin.yml"
      use-json-response-mode:
        description: "Request JSON object responses when the provider supports response_format. Leave empty to use repo config or default true."
        required: false
        type: string
        default: ""
      agent-mode:
        description: "auto runs a multi-turn review with repository tools and falls back to single-shot when the model lacks tool support; off always runs single-shot. Leave empty to defer to .github/robin.yml; when both are unset the single-shot review runs."
        required: false
        type: string
        default: ""
      agent-max-turns:
        description: "Maximum tool-calling turns in agent mode. Leave empty to use repo config (default 40)."
        required: false
        type: string
        default: ""
      agent-max-diff-size:
        description: "Diff characters sent up front in agent mode; the single-shot fallback keeps max-diff-size. Leave empty to use repo config (default 200000)."
        required: false
        type: string
        default: ""
      runner:
        description: "Runner label or JSON array of labels to use for the review job."
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      LLM_API_KEY:
        required: true
      LLM_BASE_URL:
        required: true
      LLM_MODEL:
        required: true
      ROBIN_TOKEN:
        description: "Optional token for PR API calls and comments. Pass a GitHub App installation token or PAT to post as that identity instead of github-actions[bot]. Defaults to github.token."
        required: false

permissions:
  actions: read # lets Robin detect when a cancelled run was superseded by a newer one
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    # Job-level so it applies only after `if` passes: at workflow level, every PR comment
    # (e.g. a Vercel bot) would start a skipped run that still cancels an in-flight review.
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 45
    steps:
      - name: Robin
        uses: antongulin/robin@main
        with:
          github-token: ${{ secrets.ROBIN_TOKEN || github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          fail-on-high: ${{ inputs.fail-on-high }}
          request-changes: ${{ inputs.request-changes }}
          max-diff-size: ${{ inputs.max-diff-size }}
          max-comments: ${{ inputs.max-comments }}
          max-output-tokens: ${{ inputs.max-output-tokens }}
          reasoning-effort: ${{ inputs.reasoning-effort }}
          llm-timeout-ms: ${{ inputs.llm-timeout-ms }}
          llm-temperature: ${{ inputs.llm-temperature }}
          min-command-permission: ${{ inputs.min-command-permission }}
          review-instructions: ${{ inputs.review-instructions }}
          review-instructions-file: ${{ inputs.review-instructions-file }}
          review-on-synchronize: ${{ inputs.review-on-synchronize }}
          config-file: ${{ inputs.config-file }}
          use-json-response-mode: ${{ inputs.use-json-response-mode }}
          agent-mode: ${{ inputs.agent-mode }}
          agent-max-turns: ${{ inputs.agent-max-turns }}
          agent-max-diff-size: ${{ inputs.agent-max-diff-size }}
