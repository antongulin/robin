name: "Robin"
description: "Free AI code reviews for every PR. BYOK, works with OpenRouter free tier. Auto-reviews on open, /robin or /review on demand. No quotas."
author: "antongulin"
branding:
  icon: "feather"
  color: "green"

inputs:
  github-token:
    description: "GitHub token for posting PR review comments"
    required: true
    default: "${{ github.token }}"
  llm-api-key:
    description: "API key for your LLM endpoint. Use \"ollama\" for self-hosted Ollama."
    required: false
    default: "ollama"
  llm-base-url:
    description: "Base URL for OpenAI-compatible API. Examples: https://api.openai.com/v1, http://your-server:11434/v1"
    required: true
  model:
    description: "Model name to use. Examples: gpt-4o, llama3.2, codellama:13b, or your provider-specific model name."
    required: true
  fail-on-high:
    description: "If true, the action will fail when high severity issues are found."
    required: false
    default: "false"
  request-changes:
    description: "Whether a high severity finding submits a blocking REQUEST_CHANGES review. true posts REQUEST_CHANGES; false always posts a non-blocking COMMENT (advisor mode). Leave empty to use the repo config, which defaults to true."
    required: false
    default: ""
  max-diff-size:
    description: "Maximum diff characters for a single-shot review or /summary, counted after path filters. When the filtered diff is larger, that path fails before its model request and the failed status reports the observed size, this limit, and how to fix it; Robin never sends a truncated diff. Empty defers to base-branch config, then 500000. The full request also faces the estimated token budget."
    required: false
    default: ""
  estimated-request-token-budget:
    description: "Estimated per-request working budget (default 256000), including complete UTF-8 JSON input / 3, output cap and ceil(budget / 16) safety. Empty defers to base-branch config; off disables this estimate and its default output cap. Not an exact provider token/context limit or whole-run cap."
    required: false
    default: ""
  max-output-tokens:
    description: "Positive safe integer response cap, preserved across compatibility retries. Empty uses min(32000, floor(estimated-request-token-budget / 8)), at least 1, when the guard is enabled; off with no explicit cap uses the provider/model default."
    required: false
    default: ""
  reasoning-effort:
    description: "Reasoning effort for providers/models that accept it (for example low, medium, high, xhigh, or max). Leave empty to defer to .github/robin.yml; when both are unset no reasoning control is sent and the provider/model decides. Set to off to send no reasoning configuration explicitly. OpenCode Go sends native reasoning_effort and surfaces rejected values without dropping the configured effort. Other providers retry unsupported or invalid values once with no reasoning override and leave a status warning."
    required: false
    default: ""
  llm-timeout-ms:
    description: "Timeout in milliseconds for LLM requests. Default is 10 minutes (600000 ms). Increase if you frequently see 'Request timed out' with large diffs."
    required: false
    default: "600000"
  llm-temperature:
    description: "Sampling temperature for LLM requests, between 0 and 2. Default is 0.1 for near-deterministic reviews. Some models only accept a fixed value (for example Kimi requires 1)."
    required: false
    default: "0.1"
  max-comments:
    description: "Maximum number of inline review comments to post. Extra findings stay in the review body."
    required: false
    default: "15"
  review-on-synchronize:
    description: "Review when new commits are pushed to an existing PR (the pull_request synchronize event). Default false: pushes are skipped and reviewed manually with /review. Set true, and trigger the workflow on synchronize, to review every push."
    required: false
    default: "false"
  min-command-permission:
    description: "Minimum repository permission required to run slash commands: read, triage, write, maintain, or admin."
    required: false
    default: "write"
  bot-review-policy:
    description: "Automatic PR review policy: all reviews everyone (default), none skips GitHub Bot authors, allowlist reviews humans and bot logins in bot-allowlist. Empty defers to base-branch repo config. Authorized manual commands bypass this filter."
    required: false
    default: ""
  bot-allowlist:
    description: "Comma-separated bot author logins for bot-review-policy: allowlist (exact, case-insensitive). Empty defers to base-branch repo config; [] clears the list. Default empty list excludes all bots in allowlist mode."
    required: false
    default: ""
  review-instructions:
    description: "Additional reviewer instructions appended to the built-in review prompt."
    required: false
    default: ""
  review-instructions-file:
    description: "Repository file containing additional reviewer instructions. Read from the PR base branch for safety."
    required: false
    default: ".github/code-reviewer.md"
  config-file:
    description: "Optional repository config file on the PR base branch (.github/robin.yml)."
    required: false
    default: ".github/robin.yml"
  agent-mode:
    description: "auto runs a multi-turn review with read-only repository tools at the PR head; off uses a single-shot diff review without a snapshot or tools. Leave empty to defer to base-branch .github/robin.yml; when both are unset auto runs. Tool rejection or snapshot failure attempts a complete diff-only fallback subject to max-diff-size."
    required: false
    default: ""
  agent-max-turns:
    description: "Maximum tool-calling turns in agent mode before Robin asks for the final review (capped at 100). Leave empty to use the repo config, which defaults to 40."
    required: false
    default: ""
  agent-max-diff-size:
    description: "Maximum diff characters sent up front in agent mode, counted after path filters. When the filtered diff is larger, the run fails before the agent model request and the failed status reports the observed size, this limit, and how to fix it. Agent tools read files at the PR head, not dropped diff hunks. The single-shot fallback keeps max-diff-size. Leave empty to use the repo config, which defaults to 500000."
    required: false
    default: ""
  use-json-response-mode:
    description: "Request strict JSON-schema review responses (falls back to JSON-object mode, then none, if the provider rejects it). Leave empty to use repo config or default true."
    required: false
    default: ""

outputs:
  usage-report:
    description: "Compact sanitized per-invocation LLM usage JSON; provider-reported tokens and coverage, not cost."
  usage-report-path:
    description: "Full sanitized JSON ledger in a runner-local file for subsequent steps in this job. Not a downloadable artifact."

runs:
  using: "node24"
  main: "dist/index.js"
